[project]
name = "kairos"
version = "0.1.0"
description = "Personal AI-powered stock and ETF research assistant"
authors = [{ name = "Franze Calleja" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
